<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6eee5"><meta name="referrer" content="no-referrer"><title>하루 메모</title><link rel="stylesheet" href="memo.css"><link rel="manifest" href="manifest.json"><script src="https://accounts.google.com/gsi/client" async defer></script><script type="module" src="app.mjs"></script></head>
<body><header><a href="../" class="brand">HARU <span>하루 메모</span></a><button id="login" type="button">Google로 로그인</button></header>
<main><section class="intro"><h1>어디서든, 이어 쓰는 메모.</h1><p>PC에서 쓰던 내용을 휴대폰에서도. 같은 구글 계정으로 연결하세요.</p><p id="status" role="status" aria-live="polite">로그인하면 하루 메모를 불러옵니다.</p><p id="account"></p></section>
<section id="workspace" hidden><div class="toolbar"><label class="search">메모 찾기<input id="search" type="search" placeholder="내용 검색" autocomplete="off"></label><button id="new">새 메모</button><button id="refresh" class="secondary">새로고침</button></div><div class="panes"><aside><div id="list" aria-label="내 메모 목록"></div><p id="empty">첫 메모를 작성해 보세요.</p><label class="trash"><input id="trash" type="checkbox"> 삭제한 메모 보기</label></aside>
<section id="editor" hidden><p id="conflict" class="notice" hidden>동시에 수정한 내용을 모두 보존했습니다. 내용을 정리한 뒤 저장하세요.</p><label for="text">메모 내용</label><textarea id="text" maxlength="200000" placeholder="기억해 둘 내용을 적어 보세요."></textarea><div class="actions"><button id="save">저장</button><button id="remove" class="secondary">삭제</button><span id="draftHint"></span></div></section><p id="selectHint" class="selectHint">메모를 선택하거나 새 메모를 작성하세요.</p></div></section>
<footer><p>열려 있는 화면에서 변경을 확인합니다. PC는 약 30초, 휴대폰은 약 15초 간격입니다.</p><a href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">구글 캘린더 열기</a><a href="../privacy.html">개인정보 안내</a><button id="logout" class="link" hidden>이 화면에서 로그아웃</button></footer></main><dialog id="confirm" aria-labelledby="confirmText"><form method="dialog"><p id="confirmText"></p><div class="actions"><button value="cancel" class="secondary" autofocus>취소</button><button value="ok">확인</button></div></form></dialog></body></html>
